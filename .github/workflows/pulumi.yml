name: GitOps Infrastructure Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: "Pulumi Action"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - up

permissions:
  contents: read
  id-token: write # Required for Google Cloud Workload Identity Federation
  pull-requests: write # Required for Pulumi to comment diffs on PRs

jobs:
  checks:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        # Version from "packageManager" in package.json
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Run ESLint
        run: pnpm run lint

      - name: TypeScript Build Check
        run: pnpm run build

      # This repo is a template: forks deploy once they set the GCP variables
      # (see README Step 2). Until then the Pulumi job is skipped, not failed.
      - name: Report skipped deployment
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER == '' || vars.GCP_SERVICE_ACCOUNT == '' || vars.GCP_PROJECT_ID == ''
        run: echo "::notice title=Pulumi skipped::Set the GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT and GCP_PROJECT_ID repository variables to run pulumi preview/up (README Step 1-2)."

  pulumi:
    name: Pulumi GitOps
    needs: checks
    if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        # Version from "packageManager" in package.json
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile=false

      # Keyless authentication via Google Cloud Workload Identity Federation (WIF)
      - name: Authenticate to Google Cloud via WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # The passphrase encrypts the secrets in the state (scripts/setup-wif.sh)
      - name: Load Pulumi passphrase from Secret Manager
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          PASSPHRASE="$(gcloud secrets versions access latest \
            --secret=pulumi-config-passphrase --project="${PROJECT_ID}")"
          echo "::add-mask::${PASSPHRASE}"
          echo "PULUMI_CONFIG_PASSPHRASE=${PASSPHRASE}" >> "${GITHUB_ENV}"

      - name: Setup Pulumi CLI
        uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58 # v6.6.1
        with:
          pulumi-version: 3.x

      # The state bucket and the prod stack are created by scripts/setup-wif.sh
      - name: Select the Pulumi stack
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          pulumi login "gs://${PROJECT_ID}-pulumi-state"
          pulumi stack select prod

      # PRs: Run preview and comment diff on Pull Request
      # Uses Google Cloud Storage backend (zero external accounts or tokens needed)
      - name: Pulumi Preview (PR or manual preview)
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'preview')
        uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58 # v6.6.1
        with:
          command: preview
          stack-name: prod
          cloud-url: gs://${{ vars.GCP_PROJECT_ID }}-pulumi-state
          comment-on-pr: true

      # Merge to main: Run pulumi up to apply infrastructure to GCP
      # refresh reconciles state with the cloud first, so services deleted
      # out-of-band (e.g. by hand during incidents) are recreated instead of
      # failing the update with 404.
      - name: Pulumi Up (Merge to main or manual up)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'up'))
        uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58 # v6.6.1
        with:
          command: up
          stack-name: prod
          cloud-url: gs://${{ vars.GCP_PROJECT_ID }}-pulumi-state
          refresh: true
