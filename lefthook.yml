# Lefthook Git Hooks Configuration
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    prettier:
      glob: "*.{js,ts,mjs,json,yaml,yml,md}"
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
    eslint:
      glob: "*.{js,ts,mjs}"
      run: pnpm exec eslint {staged_files} --fix
      stage_fixed: true
    typecheck:
      run: pnpm run build
